name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref != 'refs/heads/main') || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

env:
  PYTHON: ~

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Julia minimum - Linux - 1 thread
            version: min
            os: ubuntu-latest
            arch: x64
            threads: '1'
            coverage: false
          - name: Julia latest - Linux - 1 thread
            version: '1'
            os: ubuntu-latest
            arch: x64
            threads: '1'
            coverage: true
          - name: Julia latest - Windows - 1 thread
            version: '1'
            os: windows-latest
            arch: x64
            threads: '1'
            coverage: false
          - name: Julia latest - macOS - 1 thread
            version: '1'
            os: macos-latest
            arch: default
            threads: '1'
            coverage: false
          - name: Julia latest - Linux - 4 threads
            version: '1'
            os: ubuntu-latest
            arch: x64
            threads: '4'
            coverage: false

    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}
        env:
          JULIA_NUM_THREADS: ${{ matrix.threads }}
      - uses: julia-actions/julia-processcoverage@v1
        if: matrix.coverage
      - uses: codecov/codecov-action@v6
        if: matrix.coverage
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}

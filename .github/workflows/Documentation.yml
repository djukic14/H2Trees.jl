name: Documentation

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.ref != 'refs/heads/main') || github.run_number }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  contents: read

env:
  PYTHON: ~

jobs:
  build:
    name: Documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Cache pre-rendered documentation plots
        uses: actions/cache@v4
        with:
          path: |
            docs/src/assets/plots
            docs/.plots_hash
          key: docplots-${{ hashFiles('src/**', 'ext/**', 'docs/plots/**', 'docs/plotutils.jl', 'docs/genplots.jl', 'docs/ensureplots.jl', 'docs/Project.toml') }}
      - name: Configure documentation environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - name: Build documentation and doctests
        shell: julia --project=docs --color=yes {0}
        run: include(joinpath(pwd(), "docs", "make.jl"))
      - name: Run doctests
        shell: julia --project=docs --color=yes {0}
        run: |
          using Documenter: DocMeta, doctest
          using H2Trees
          DocMeta.setdocmeta!(H2Trees, :DocTestSetup, :(using H2Trees); recursive=true)
          doctest(H2Trees)

  deploy:
    name: Deploy documentation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v6
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Cache pre-rendered documentation plots
        uses: actions/cache@v4
        with:
          path: |
            docs/src/assets/plots
            docs/.plots_hash
          key: docplots-${{ hashFiles('src/**', 'ext/**', 'docs/plots/**', 'docs/plotutils.jl', 'docs/genplots.jl', 'docs/ensureplots.jl', 'docs/Project.toml') }}
      - name: Configure documentation environment
        shell: julia --project=docs --color=yes {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-docdeploy@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
